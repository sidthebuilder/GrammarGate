name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust-and-python-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build and test Rust core
        run: |
          cargo test --manifest-path grammargate_core/Cargo.toml --verbose
          cargo build --release --manifest-path grammargate_core/Cargo.toml --verbose
          mkdir -p grammargate_core
          find target -name "libgrammargate_core.so" -exec cp {} grammargate_core/ \;

      - name: Cache Hugging Face Hub models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-qwen05b-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install --upgrade pytest "xgrammar>=0.2.9" transformers numpy pydantic jsonschema

      - name: Run Rust FFI & Native XGrammar Tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_rust_core.py \
                 tests/test_rust_analyzer.py \
                 tests/test_native_xgrammar_ci.py \
                 -v --tb=short --junitxml=pytest-native.xml

      - name: Run Gate, Escalator & vLLM Adapter Tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_logit_gate.py \
                 tests/test_escalator.py \
                 tests/test_vllm_adapter.py \
                 -v --tb=short --junitxml=pytest-core.xml

      - name: Run SpecLook & HS-Gate Tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_speclook_gate.py \
                 tests/test_hs_gate.py \
                 -v --tb=short --junitxml=pytest-gates.xml

      - name: Run Ablation & CDA Benchmark Suites
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_ablation_runner.py \
                 benchmarks/attacks/ \
                 benchmarks/utility/ \
                 -v --tb=short --junitxml=pytest-bench.xml

      - name: Emit Pytest Failure Annotations
        if: failure()
        run: |
          python -c '
          import glob, xml.etree.ElementTree as ET
          for path in sorted(glob.glob("pytest-*.xml")):
              root = ET.parse(path).getroot()
              for tc in root.iter("testcase"):
                  for fail in list(tc.findall("failure")) + list(tc.findall("error")):
                      name = tc.attrib.get("name", "unknown")
                      cls = tc.attrib.get("classname", "")
                      msg = (fail.attrib.get("message", "") or fail.text or "").strip().replace("\n", " | ")[:400]
                      print(f"::error title={cls}.{name}::{msg}")
          '
