name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust-and-python-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build and test Rust core
        run: |
          cargo test --manifest-path grammargate_core/Cargo.toml --verbose
          cargo build --release --manifest-path grammargate_core/Cargo.toml --verbose
          mkdir -p grammargate_core
          find target -name "libgrammargate_core.so" -exec cp {} grammargate_core/ \;

      - name: Cache Hugging Face Hub models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-qwen05b-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest xgrammar transformers numpy

      - name: Run Python CPU-compatible unit and benchmark tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_rust_core.py \
                 tests/test_rust_analyzer.py \
                 tests/test_logit_gate.py \
                 tests/test_escalator.py \
                 tests/test_vllm_adapter.py \
                 tests/test_speclook_gate.py \
                 tests/test_hs_gate.py \
                 tests/test_ablation_runner.py \
                 benchmarks/attacks/ \
                 benchmarks/utility/ \
                 -v
