[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "grammargate"
version = "0.1.0"
description = "Inference-time safety gate defending LLMs against Constrained Decoding Attacks (CDA)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.38.0",
    "tokenizers>=0.19.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
xgrammar = ["xgrammar>=0.2.9"]
eval = ["xgrammar>=0.2.9", "numpy>=1.24.0"]
dev = ["pytest>=8.0.0", "numpy>=1.24.0", "xgrammar>=0.2.9"]

[tool.maturin]
manifest-path = "grammargate_core/Cargo.toml"
module-name = "grammargate_core"
python-source = "."

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
